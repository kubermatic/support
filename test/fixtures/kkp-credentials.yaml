---
apiVersion: v1
kind: Namespace
metadata:
  name: kubermatic
---
apiVersion: kubermatic.k8c.io/v1
kind: Preset
metadata:
  name: leakcheck-preset
spec:
  aws:
    accessKeyID: LEAKCHECK-aws-access-key-id
    secretAccessKey: LEAKCHECK-aws-secret-access-key
  openstack:
    username: KEEPCHECK-openstack-username
    password: LEAKCHECK-openstack-password
    applicationCredentialID: LEAKCHECK-os-app-cred-id
    applicationCredentialSecret: LEAKCHECK-os-app-cred-secret
  hetzner:
    token: LEAKCHECK-hetzner-token
  digitalocean:
    token: LEAKCHECK-do-token
  gcp:
    serviceAccount: LEAKCHECK-gcp-service-account-base64
  azure:
    clientSecret: LEAKCHECK-azure-client-secret
  alibaba:
    accessKeySecret: LEAKCHECK-alibaba-access-key-secret
  kubevirt:
    kubeconfig: LEAKCHECK-kubevirt-kubeconfig
  vsphere:
    username: KEEPCHECK-vsphere-username
    password: LEAKCHECK-vsphere-password
    csiPassword: LEAKCHECK-vsphere-csi-password
  anexia:
    token: LEAKCHECK-anexia-token
  nutanix:
    password: LEAKCHECK-nutanix-password
    csiPassword: LEAKCHECK-nutanix-csi-password
  vmwareclouddirector:
    password: LEAKCHECK-vcd-password
    apiToken: LEAKCHECK-vcd-api-token
  packet:
    apiKey: LEAKCHECK-packet-api-key
---
apiVersion: kubermatic.k8c.io/v1
kind: Cluster
metadata:
  name: leakcheck-cluster
spec:
  version: KEEPCHECK-1.31.0
  serviceAccount:
    tokenVolumeProjectionEnabled: true
    issuer: KEEPCHECK-issuer
  encryptionConfiguration:
    enabled: true
    secretbox:
      keys:
        - name: KEEPCHECK-key-name
          value: LEAKCHECK0123456789abcdefghijklmnopqrstu=
  cloud:
    providerName: openstack
    openstack:
      password: LEAKCHECK-cluster-os-password
      credentialsReference:
        name: KEEPCHECK-credential-secret
        namespace: kubermatic
    kubevirt:
      csiKubeconfig: LEAKCHECK-cluster-csi-kubeconfig
      kubeconfig: LEAKCHECK-cluster-kubeconfig
status:
  address:
    adminToken: LEAKCHECK-admin-token
---
apiVersion: kubermatic.k8c.io/v1
kind: KubermaticConfiguration
metadata:
  name: leakcheck-config
  namespace: kubermatic
spec:
  imagePullSecret: LEAKCHECK-dockerconfigjson
  auth:
    tokenIssuer: KEEPCHECK-token-issuer
    issuerClientSecret: LEAKCHECK-issuer-client-secret
    issuerCookieKey: LEAKCHECK-issuer-cookie-key
    serviceAccountKey: LEAKCHECK-service-account-key
    skipTokenIssuerTLSVerify: false
  api:
    secretName: KEEPCHECK-secret-name
    secretKey: KEEPCHECK-secret-key
---
apiVersion: kubermatic.k8c.io/v1
kind: Seed
metadata:
  name: leakcheck-seed
  namespace: kubermatic
spec:
  kubeconfig:
    name: KEEPCHECK-seed-kubeconfig
    namespace: kubermatic
  oidcProviderConfiguration:
    issuerClientSecret: LEAKCHECK-seed-issuer-client-secret
    cookieHashKey: LEAKCHECK-seed-cookie-hash-key
    useToken: true
  datacenters:
    dc1:
      spec:
        kubevirt:
          dnsPolicy: ClusterFirst
          infraStorageClasses:
            - name: KEEPCHECK-storage-class
        vsphere:
          infraManagementUser:
            username: KEEPCHECK-infra-user
            password: LEAKCHECK-seed-vsphere-password
---
apiVersion: apps.kubermatic.k8c.io/v1
kind: ApplicationInstallation
metadata:
  name: leakcheck-install
  namespace: kubermatic
spec:
  activeKey: KEEPCHECK-active-key
  values:
    auth:
      rootPassword: LEAKCHECK-helm-root-password
    replicas: 3
  valuesBlock: |
    auth:
      rootPassword: LEAKCHECK-helm-values-block
---
apiVersion: apps.kubermatic.k8c.io/v1
kind: ApplicationDefinition
metadata:
  name: leakcheck-appdef
spec:
  defaultValues:
    auth:
      adminPassword: LEAKCHECK-helm-default-password
    replicas: 1
  defaultValuesBlock: |
    auth:
      adminPassword: LEAKCHECK-helm-default-values-block
---
apiVersion: example.com/v1
kind: Widget
metadata:
  name: leakcheck-widget
  namespace: kubermatic
spec:
  database:
    adminUser: KEEPCHECK-widget-user
    adminPassword: LEAKCHECK-widget-admin-password
